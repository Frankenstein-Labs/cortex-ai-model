[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cortex-ai"
version = "0.1.0"
description = "Model-agnostic runtime foundation for CORTEX AI"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["fastapi>=0.110", "uvicorn[standard]>=0.29", "httpx>=0.27", "pydantic>=2.0", "typer>=0.12"]

[project.scripts]
cortex-ai = "cortex_ai.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/cortex_ai"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
